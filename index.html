<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Review</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .view-toggle { display: flex; gap: 5px; background: #1c1c1e; padding: 4px; border-radius: 10px; }
        .v-btn { border: none; background: none; color: #555; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .v-btn.active { background: #3a3a3c; color: #fff; }

        #tabs { display: flex; gap: 10px; padding: 0 15px 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #222; }
        #tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 18px; background: #1c1c1e; border-radius: 10px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }

        /* GRID / LIST */
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: #151515; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .info { padding: 10px; }
        
        .list-mode { display: flex !important; flex-direction: column !important; gap: 8px !important; }
        .list-mode .card { display: flex; align-items: center; padding: 8px 15px; height: 55px; }
        .list-mode .thumb { width: 80px; height: 45px; margin-right: 15px; border-radius: 6px; }
        .list-mode .info { display: flex; flex: 1; justify-content: space-between; align-items: center; padding: 0; }

        /* PLAYER PAGE */
        #player-view { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; overflow-y: auto; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .p-nav { display: flex; justify-content: center; gap: 30px; padding: 15px; background: #111; border-bottom: 1px solid #222; }
        .p-btn { background: #222; border: none; color: #fff; width: 55px; height: 55px; border-radius: 14px; font-size: 22px; cursor: pointer; }
        .p-body { padding: 20px; }
    </style>
</head>
<body>

<div id="grid-view">
    <div class="header">
        <div style="font-weight:900; font-size:20px;">БОГАТЫРИ</div>
        <div class="view-toggle">
            <button class="v-btn active" onclick="setView('grid', this)">田</button>
            <button class="v-btn" onclick="setView('list', this)">≡</button>
        </div>
    </div>
    <div id="tabs"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="player-view">
    <video id="v-player" loop playsinline autoplay muted></video>
    <div class="p-nav">
        <button class="p-btn" onclick="vStep(-1)">⏮</button>
        <button class="p-btn" onclick="vPlay()">⏯</button>
        <button class="p-btn" onclick="vStep(1)">⏭</button>
    </div>
    <div class="p-body">
        <h2 id="p-title" style="margin:0"></h2>
        <div id="p-meta" style="margin: 10px 0 20px 0; color: #007aff; font-weight: bold; font-size: 16px;"></div>
        <textarea id="p-comm" style="width:100%; background:#1c1c1e; border:1px solid #333; color:#fff; padding:15px; border-radius:12px; height:100px; box-sizing:border-box; font-family:inherit; font-size:16px;" placeholder="Ваш комментарий..."></textarea>
        <button style="width:100%; background:#007aff; color:#fff; border:none; padding:18px; border-radius:12px; font-weight:700; margin-top:10px; font-size:16px;">ОТПРАВИТЬ</button>
        <div id="p-history" style="margin-top:30px;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const KEY = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    
    let records = [];
    let curFilter = '';

    async function init() {
        tg.expand();
        const r = await fetch(`https://api.airtable.com/v0/${BASE}/Shots?sort[0][field]=shot_name&sort[0][direction]=asc`, {
            headers: { Authorization: `Bearer ${KEY}` }
        });
        const json = await r.json();
        records = json.records || [];
        
        const eps = [...new Set(records.map(r => (r.fields.shot_name||"").split('_')[0].toLowerCase()))].filter(e=>e.startsWith('ep')).sort();
        document.getElementById('tabs').innerHTML = eps.map((ep, i) => `
            <div class="tab ${i===0?'active':''}" onclick="setFilter('${ep}', this)">${ep.toUpperCase()}</div>`).join('');
        if(eps.length > 0) setFilter(eps[0]);
    }

    function setFilter(f, el) {
        curFilter = f;
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        render();
    }

    function setView(mode, el) {
        document.getElementById('main-grid').className = mode === 'list' ? 'list-mode' : '';
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = records.filter(r => (r.fields.shot_name||"").toLowerCase().startsWith(curFilter)).map(r => `
            <div class="card" onclick='openPlayer(${JSON.stringify(r)})'>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                <div class="info">
                    <div style="font-weight:700; font-size:14px;">${r.fields.shot_name}</div>
                    <div style="color:#007aff; font-size:12px; font-weight:700;">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                    <div style="font-size:10px; font-weight:900; text-transform:uppercase; color:#888;">${r.fields.status || ''}</div>
                </div>
            </div>`).join('');
    }

    async function openPlayer(r) {
        document.getElementById('grid-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        
        const v = document.getElementById('v-player');
        
        // ВОТ ТУТ ЛОГИКА ДЛЯ ATTACHMENT (preview_file2)
        if(r.fields.preview_file2 && r.fields.preview_file2.length > 0) {
            v.src = r.fields.preview_file2[0].url;
        } else {
            v.src = ""; // Если пусто
        }

        document.getElementById('p-title').innerText = r.fields.shot_name;
        document.getElementById('p-meta').innerText = `v${String(r.fields.version || 0).padStart(3, '0')} | ${r.fields.status || ''}`;

        // Комменты
        const filter = encodeURIComponent(`{shot_name}='${r.fields.shot_name}'`);
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=${filter}&sort%5B0%5D%5Bfield%5D=Created&sort%5B0%5D%5Bdirection%5D=desc`, {
            headers: { Authorization: `Bearer ${KEY}` }
        });
        const cData = await res.json();
        document.getElementById('p-history').innerHTML = (cData.records || []).map(c => `
            <div style="background:#161618; padding:12px; border-radius:10px; margin-bottom:10px; border:1px solid #222; font-size:14px;">${c.fields.text || ''}</div>`).join('');

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            v.pause(); v.src = "";
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    function vPlay() { const v = document.getElementById('v-player'); v.paused ? v.play() : v.pause(); }
    function vStep(d) { const v = document.getElementById('v-player'); v.pause(); v.currentTime += d * (1/24); }

    init();
</script>
</body>
</html>
