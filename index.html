<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Header */
        .header-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .project-header { font-size: 20px; font-weight: 900; text-transform: uppercase; }
        .view-toggle { display: flex; gap: 8px; background: #1c1c1e; padding: 4px; border-radius: 8px; }
        .view-btn { border: none; background: none; color: #666; cursor: pointer; padding: 6px 12px; font-size: 16px; border-radius: 6px; }
        .view-btn.active { background: #3a3a3c; color: #fff; }

        /* Tabs */
        #tabs-bar { display: flex; overflow-x: auto; padding: 10px; gap: 6px; border-bottom: 1px solid #222; }
        .tab { padding: 6px 14px; background: #1c1c1e; border-radius: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; color: #8e8e93; }
        .tab.active { background: #007aff; color: #fff; }

        /* Grid */
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: #1c1c1e; border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #111; }
        
        /* LIST MODE - Исправленная верстка */
        #main-grid.list-mode { display: flex; flex-direction: column; gap: 8px; }
        .list-mode .card { display: flex; align-items: center; padding: 8px 12px; flex-direction: row; }
        .list-mode .thumb { width: 60px; height: 35px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; }
        .list-mode .card-info { display: flex; flex: 1; align-items: center; justify-content: space-between; min-width: 0; gap: 10px; }
        
        .info-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
        .info-ver { color: #007aff; font-weight: bold; font-size: 13px; flex-shrink: 0; }
        .info-status { width: 90px; text-align: right; font-weight: 800; font-size: 10px; text-transform: uppercase; flex-shrink: 0; }

        /* Player */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: auto; }
        .player-wrapper { display: flex; flex-direction: column; width: 100%; }
        video { width: 100%; max-height: 70vh; background: #000; object-fit: contain; }
        .custom-controls { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 15px; background: #111; }
        .p-btn { background: #2c2c2e; border: none; color: #fff; width: 44px; height: 44px; border-radius: 8px; font-size: 20px; cursor: pointer; }

        /* Info Panel */
        .info-panel { padding: 20px 15px; max-width: 800px; margin: 0 auto; }
        .shot-head { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .st-badge { padding: 4px 12px; border-radius: 6px; text-transform: uppercase; font-size: 16px; font-weight: 800; }
        
        .comment-input { width: 100%; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; min-height: 100px; font-size: 16px; outline: none; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; }
        .send-btn { width: 100%; background: #007aff; border: none; color: #fff; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .history-item { background: #161618; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #222; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>

<div id="list-view">
    <div class="header-row">
        <div class="project-header">БОГАТЫРИ</div>
        <div class="view-toggle">
            <button class="view-btn active" id="btn-tiles" onclick="setView('tiles')">田</button>
            <button class="view-btn" id="btn-list" onclick="setView('list')">≡</button>
        </div>
    </div>
    <div id="tabs-bar"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="detail-view">
    <div class="player-wrapper">
        <video id="main-v" loop playsinline></video>
        <div class="custom-controls">
            <button class="p-btn" onclick="step(-1)">⏮</button>
            <button class="p-btn" onclick="toggleP()">⏯</button>
            <button class="p-btn" onclick="step(1)">⏭</button>
        </div>
    </div>
    <div class="info-panel">
        <div class="shot-head">
            <span id="det-title"></span> 
            <span id="det-ver" style="color:#007aff;"></span> 
            <span id="det-status" class="st-badge"></span>
        </div>
        <textarea id="comm-text" class="comment-input" placeholder="Ваш комментарий..."></textarea>
        <button class="send-btn" onclick="sendComment()">Отправить</button>
        <div id="history" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const N8N_WEBHOOK = 'https://n8n.cg-vfx.ru/webhook/6226068d-be62-466d-883a-446ec2726589';

    const statusConfig = { 
        'ready to start': '#808080', 'in progress': '#3498db', 'pause': '#9b59b6', 
        'to fix': '#e67e22', 'review': '#f1c40f', 'approved': '#2ecc71' 
    };

    let allRecords = [];
    let currentFilter = '';
    let currentMode = 'tiles';
    let currentShot = null;
    const vid = document.getElementById('main-v');

    async function init() {
        tg.expand();
        try {
            const r = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, { 
                headers: { Authorization: "Bearer " + TOKEN } 
            });
            const data = await r.json();
            allRecords = data.records || [];
            renderTabs();
        } catch (e) {
            document.getElementById('main-grid').innerText = "Ошибка загрузки.";
        }
    }

    function setView(mode) {
        currentMode = mode;
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        const grid = document.getElementById('main-grid');
        if (mode === 'list') {
            grid.classList.add('list-mode');
            document.getElementById('btn-list').classList.add('active');
        } else {
            grid.classList.remove('list-mode');
            document.getElementById('btn-tiles').classList.add('active');
        }
        renderGrid(currentFilter);
    }

    function renderTabs() {
        const eps = [...new Set(allRecords.map(r => (r.fields.shot_name || "").substring(0, 4).toLowerCase()))].filter(e => e.startsWith('ep')).sort();
        document.getElementById('tabs-bar').innerHTML = eps.map((ep, i) => `<div class="tab ${i===0?'active':''}" onclick="currentFilter='${ep}'; renderGrid('${ep}'); selectTab(this)">${ep.toUpperCase()}</div>`).join('');
        if(eps.length > 0) { currentFilter = eps[0]; renderGrid(eps[0]); }
    }

    function selectTab(el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); }

    function renderGrid(filter) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = allRecords.filter(r => (r.fields.shot_name || "").toLowerCase().startsWith(filter)).map(r => {
            const st = r.fields.status || '';
            const color = statusConfig[st.toLowerCase()] || '#8e8e93';
            const ver = 'v' + String(r.fields.version || 0).padStart(3, '0');
            
            return `
            <div class="card" onclick='openShot(${JSON.stringify(r)})'>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                <div class="card-info">
                    <div class="info-name">${r.fields.shot_name}</div>
                    <div class="info-ver">${ver}</div>
                    <div class="info-status" style="color:${color}">${st}</div>
                </div>
            </div>`;
        }).join('');
    }

    async function openShot(r) {
        currentShot = r;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        
        const filter = encodeURIComponent(`{shot_name}='${r.fields.shot_name}'`);
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=${filter}&sort%5B0%5D%5Bfield%5D=Created&sort%5B0%5D%5Bdirection%5D=desc`, {
            headers: { Authorization: "Bearer " + TOKEN }
        });
        const cData = await res.json();
        
        // ПОИСК ССЫЛКИ В ПОЛЕ PREVIEW ТАБЛИЦЫ COMMENTS
        const lastWithVid = (cData.records || []).find(c => c.fields.preview && c.fields.preview.trim().startsWith('http'));
        vid.src = lastWithVid ? lastWithVid.fields.preview.trim() : "";
        if(vid.src) vid.play().catch(() => {});

        document.getElementById('det-title').innerText = r.fields.shot_name;
        document.getElementById('det-ver').innerText = 'v' + String(r.fields.version || 0).padStart(3, '0');
        const st = r.fields.status || '';
        const stEl = document.getElementById('det-status');
        stEl.innerText = st;
        stEl.style.background = statusConfig[st.toLowerCase()] || '#444';
        
        document.getElementById('history').innerHTML = (cData.records || []).map(c => `<div class="history-item">${c.fields.text || ''}</div>`).join('');

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            vid.pause(); vid.src = "";
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    async function sendComment() {
        const txt = document.getElementById('comm-text').value;
        if(!txt || !currentShot) return;
        fetch(N8N_WEBHOOK, { method: 'POST', body: JSON.stringify({
            shot_id: currentShot.id, text: txt, author: tg.initDataUnsafe?.user?.username || "User"
        })});
        document.getElementById('comm-text').value = '';
        tg.showAlert("Отправлено!");
    }

    function toggleP() { vid.paused ? vid.play() : vid.pause(); }
    function step(d) { vid.pause(); vid.currentTime += (1/24) * d; }

    init();
</script>
</body>
</html>
