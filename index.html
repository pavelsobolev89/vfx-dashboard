<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .card { background: #1c1c1e; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        img { width: 100%; border-radius: 8px; }
        #debug-log { font-size: 10px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="main-app">
        <h3 id="status">Загрузка...</h3>
        <div id="grid"></div>
    </div>

    <div id="debug-log"></div>

    <script>
        // Функция для вывода ошибок прямо на экран телефона
        function log(msg) {
            document.getElementById('debug-log').innerText += "\n> " + msg;
        }

        async function start() {
            log("Запуск скрипта...");
            const status = document.getElementById('status');
            const grid = document.getElementById('grid');

            const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
            const BASE = 'appgiNHAoONgW8Ha6';
            const TABLE = 'Shots';

            try {
                log("Запрос к Airtable...");
                const response = await fetch("https://api.airtable.com/v0/" + BASE + "/" + TABLE, {
                    headers: { "Authorization": "Bearer " + TOKEN }
                });
                
                const data = await response.json();
                log("Ответ получен");

                if (!data.records || data.records.length === 0) {
                    status.innerText = "В Airtable пусто или ошибка";
                    log(JSON.stringify(data));
                    return;
                }

                status.innerText = "Шоты:";
                grid.innerHTML = "";

                data.records.forEach(r => {
                    const f = r.fields;
                    const div = document.createElement('div');
                    div.className = 'card';
                    
                    const name = f.shot_name || "Без названия";
                    const imgUrl = (f.thumbnail && f.thumbnail[0]) ? f.thumbnail[0].url : "";
                    
                    div.innerHTML = (imgUrl ? '<img src="' + imgUrl + '">' : '') + 
                                    '<div>' + name + '</div>';
                    grid.appendChild(div);
                });
                log("Отрисовка завершена");

            } catch (err) {
                status.innerText = "Ошибка!";
                log("FATAL: " + err.message);
            }
        }

        // Запуск
        start();
    </script>
</body>
</html>
