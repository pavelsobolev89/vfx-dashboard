<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        #main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        
        /* Карточки в сетке */
        .card { background: #1c1c1e; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #222; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .v-tag { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        
        /* Плеер */
        .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
        video { width: 100%; display: block; }
        
        .player-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex; align-items: center; justify-content: space-between;
            padding: 15px; opacity: 0; transition: opacity 0.3s;
        }
        .video-wrapper:hover .player-overlay, .video-wrapper:active .player-overlay { opacity: 1; }
        
        .p-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; backdrop-filter: blur(5px); }
        .fs-btn { background: none; border: none; color: #fff; font-size: 20px; }

        /* Инфо и статусы */
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; text-transform: uppercase; font-weight: 800; margin: 5px 0; }
        .info-panel { padding: 15px; }

        /* Секция комментариев */
        .comment-area { display: flex; gap: 8px; margin-top: 15px; }
        .comment-input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        .send-btn { background: #007aff; border: none; color: #fff; border-radius: 10px; padding: 0 20px; font-weight: bold; }
        
        #detail-view { display: none; }
        .history-card { background: #1c1c1e; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 3px solid #333; }
        .history-meta { font-size: 10px; color: #8e8e93; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="list-view">
    <div id="tabs-bar" style="display:flex; overflow-x:auto; padding:10px; gap:8px;"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="detail-view">
    <div class="video-wrapper" id="v-wrap">
        <video id="main-v" loop playsinline></video>
        <div class="player-overlay">
            <div style="display:flex; gap:10px;">
                <button class="p-btn" onclick="step(-1)">-1F</button>
                <button class="p-btn" onclick="toggleP()">Play/Pause</button>
                <button class="p-btn" onclick="step(1)">+1F</button>
            </div>
            <button class="fs-btn" onclick="goFS()">⛶</button>
        </div>
    </div>

    <div class="info-panel">
        <h2 id="det-title" style="margin:0;"></h2>
        <div id="det-ver" style="color:#007aff; font-weight:bold; margin-top:5px;"></div>
        <div id="det-status"></div>
        
        <div class="comment-area">
            <input type="text" id="comm-text" class="comment-input" placeholder="Leave your comment">
            <button class="send-btn" onclick="sendComment()">Send</button>
        </div>
        
        <div id="history-list" style="margin-top:25px;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const N8N_WEBHOOK = 'ТВОЙ_N8N_WEBHOOK_URL'; // Вставь сюда URL из n8n

    const statusColors = {
        'ready to start': '#808080', 'in progress': '#3498db',
        'pause': '#9b59b6', 'to fix': '#e67e22',
        'review': '#f1c40f', 'send to client': '#1abc9c', 'approved': '#2ecc71'
    };

    let currentShot = null;

    async function loadShots() {
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        const data = await res.json();
        renderGrid(data.records);
    }

    function renderGrid(recs) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = recs.map(r => `
            <div class="card" onclick='openShot(${JSON.stringify(r)})'>
                <div class="v-tag">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                <div style="padding:10px">
                    <div style="font-size:12px; font-weight:bold;">${r.fields.shot_name}</div>
                    <div class="status-badge" style="background:${statusColors[r.fields.status?.toLowerCase()] || '#333'}">${r.fields.status}</div>
                </div>
            </div>
        `).join('');
    }

    function openShot(r) {
        currentShot = r;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        
        const v = document.getElementById('main-v');
        // Берем видео из preview_file2 (наша актуальная версия)
        v.src = r.fields.preview_file2?.[0]?.url || "";
        v.play().catch(() => {});

        document.getElementById('det-title').innerText = r.fields.shot_name;
        document.getElementById('det-ver').innerText = 'Version: v' + String(r.fields.version || 0).padStart(3, '0');
        
        const sCol = statusColors[r.fields.status?.toLowerCase()] || '#333';
        document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${sCol}">${r.fields.status}</div>`;

        loadHistory(r.fields.shot_name);

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            v.pause();
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    async function sendComment() {
        const input = document.getElementById('comm-text');
        const text = input.value.trim();
        if(!text) return;

        const payload = {
            shot_id: currentShot.id,
            shot_name: currentShot.fields.shot_name,
            version: currentShot.fields.version,
            text: text,
            author: tg.initDataUnsafe?.user?.username || "Super",
            new_status: "to fix" // Принудительно меняем статус
        };

        try {
            const res = await fetch(N8N_WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                input.value = '';
                tg.showAlert("Sent! Status updated to To Fix.");
                // Обновляем статус локально для красоты
                document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${statusColors['to fix']}">to fix</div>`;
            }
        } catch (e) {
            alert("Error sending comment");
        }
    }

    async function loadHistory(shotName) {
        const hList = document.getElementById('history-list');
        hList.innerHTML = 'Loading history...';
        const filter = encodeURIComponent(`{shot_name}='${shotName}'`);
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=${filter}&sort[0][field]=Created&sort[0][direction]=desc`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        const data = await res.json();
        hList.innerHTML = '<h4>Activity</h4>';
        data.records.forEach(c => {
            const div = document.createElement('div');
            div.className = 'history-card';
            div.innerHTML = `
                <div class="history-meta">${c.fields.author || 'User'} • v${String(c.fields.version || 0).padStart(3, '0')}</div>
                <div>${c.fields.text || ''}</div>
            `;
            hList.appendChild(div);
        });
    }

    // Плеер
    const vid = document.getElementById('main-v');
    function toggleP() { vid.paused ? vid.play() : vid.pause(); }
    function step(d) { vid.pause(); vid.currentTime += (1/24) * d; }
    function goFS() {
        if (vid.requestFullscreen) vid.requestFullscreen();
        else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
    }

    loadShots();
</script>
</body>
</html>
