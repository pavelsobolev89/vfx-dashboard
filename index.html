<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1c; color: white; padding: 20px; }
        #debug { color: #ff4444; font-family: monospace; font-size: 12px; border: 1px solid red; padding: 10px; display: none; }
        .loading { text-align: center; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div id="app">
        <div class="loading">Загрузка данных из Airtable...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ПРОВЕРЬ ЭТИ ДАННЫЕ!
        const API_KEY = 'patBsCg6ofoalEdYD.f2e2d35a2c27f354844e618467ea0f2d0e37700fb0c24783f5b1074ba4fdaa92'; 
        const BASE_ID = 'appgiNHAoONgW8Ha6';
        const TABLE_NAME = 'Shots'; 

        const debugDiv = document.getElementById('debug');
        
        function logError(err) {
            debugDiv.style.display = 'block';
            debugDiv.innerText = "Ошибка: " + err;
        }

        async function init() {
            try {
                const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`;
                const response = await fetch(url, {
                    headers: { Authorization: `Bearer ${API_KEY}` }
                });

                if (!response.ok) {
                    throw new Error(`Airtable вернул ${response.status}. Проверь токен и ID базы.`);
                }

                const data = await response.json();
                if (data.records.length === 0) {
                    document.getElementById('app').innerHTML = "База пуста.";
                } else {
                    document.getElementById('app').innerHTML = `Найдено записей: ${data.records.length}`;
                    // Здесь будет логика вкладок и карточек, когда увидим, что связь есть
                }

            } catch (e) {
                logError(e.message);
            }
        }

        init();
    </script>
</body>
</html>
