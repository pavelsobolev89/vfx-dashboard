<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Список */
        .project-header { padding: 15px 15px 5px 15px; font-size: 20px; font-weight: 900; color: #fff; text-transform: uppercase; }
        #tabs-bar { display: flex; overflow-x: auto; padding: 10px; gap: 6px; background: #000; border-bottom: 1px solid #222; }
        .tab { padding: 6px 14px; background: #1c1c1e; border-radius: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; color: #8e8e93; }
        .tab.active { background: #007aff; color: #fff; }

        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: #1c1c1e; border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .v-tag { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        
        /* Плеер */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: auto; }
        
        /* Контейнер плеера для Fullscreen */
        .player-wrapper { display: flex; flex-direction: column; background: #000; }
        .player-container { padding-top: 20px; background: #000; flex-grow: 1; display: flex; align-items: center; }
        video { width: 100%; max-width: 1000px; display: block; margin: 0 auto; background: #000; }
        
        /* Кнопки */
        .custom-controls { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 10px; background: #111; border-bottom: 1px solid #222; }
        .p-btn { 
            background: #2c2c2e; border: none; color: #fff; 
            width: 38px; height: 38px; border-radius: 8px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            font-size: 16px; outline: none; -webkit-tap-highlight-color: transparent;
        }
        .p-btn:active { background: #007aff !important; }
        .fs-btn { background: none; color: #666; margin-left: 10px; }

        /* История и Инфо */
        .info-panel { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 10px; text-transform: uppercase; font-weight: 800; margin-bottom: 12px; }
        .comment-box { display: flex; gap: 10px; margin-bottom: 25px; }
        .comment-input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px 15px; border-radius: 10px; outline: none; }
        .send-btn { background: #007aff; border: none; color: #fff; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .history-item { background: #161618; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; font-size: 14px; color: #ccc; }

        /* Режим Фуллскрин (CSS Force) */
        .fullscreen-active #detail-view { overflow: hidden; }
        .fullscreen-active .player-wrapper { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 9999; justify-content: center; background: #000;
        }
        .fullscreen-active .player-container { padding: 0; }
        .fullscreen-active video { max-width: none; height: auto; max-height: 100vh; }
        .fullscreen-active .info-panel { display: none; }
    </style>
</head>
<body>

<div id="list-view">
    <div class="project-header">БОГАТЫРИ</div>
    <div id="tabs-bar"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="detail-view">
    <div class="player-wrapper" id="p-wrap">
        <div class="player-block">
            <div class="player-container">
                <video id="main-v" loop playsinline></video>
            </div>
            <div class="custom-controls">
                <button class="p-btn" onclick="step(-1)">⏮</button>
                <button class="p-btn" onclick="toggleP()">⏯</button>
                <button class="p-btn" onclick="step(1)">⏭</button>
                <button class="p-btn fs-btn" onclick="goFS()">⛶</button>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <h2 id="det-title" style="margin:0;"></h2>
        <div id="det-ver" style="color:#007aff; font-weight:bold; margin: 5px 0 12px 0;"></div>
        <div id="det-status"></div>
        <div class="comment-box">
            <input type="text" id="comm-text" class="comment-input" placeholder="Leave your comment">
            <button class="send-btn" onclick="sendComment()">Send</button>
        </div>
        <div id="history"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const N8N_WEBHOOK = 'ТВОЙ_URL_N8N';

    const statusConfig = {
        'ready to start': '#808080', 'in progress': '#3498db',
        'pause': '#9b59b6', 'to fix': '#e67e22',
        'review': '#f1c40f', 'approved': '#2ecc71', 'send to client': '#1abc9c'
    };

    let allRecords = [];
    let currentShot = null;
    const vid = document.getElementById('main-v');

    async function init() {
        const r = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, { headers: { Authorization: "Bearer " + TOKEN } });
        const data = await r.json();
        allRecords = data.records || [];
        renderTabs();
    }

    // Клавиатура
    window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
        if (e.key === ' ') { e.preventDefault(); toggleP(); }
        if (e.key === 'Escape' && document.body.classList.contains('fullscreen-active')) goFS();
    });

    function renderTabs() {
        const bar = document.getElementById('tabs-bar');
        const eps = [...new Set(allRecords.map(r => (r.fields.shot_name || "").substring(0, 4).toLowerCase()))].filter(e => e.startsWith('ep')).sort();
        bar.innerHTML = eps.map((ep, i) => `<div class="tab ${i===0?'active':''}" onclick="renderGrid('${ep}'); selectTab(this)">${ep.toUpperCase()}</div>`).join('');
        if(eps.length > 0) renderGrid(eps[0]);
    }

    function selectTab(el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function renderGrid(filter) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = allRecords.filter(r => (r.fields.shot_name || "").toLowerCase().startsWith(filter)).map(r => {
            const color = statusConfig[r.fields.status?.toLowerCase()] || '#333';
            return `<div class="card" onclick='openShot(${JSON.stringify(r)})'>
                <div class="v-tag">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                <div style="padding:10px; font-size:11px;">
                    <b>${r.fields.shot_name}</b><br>
                    <span style="color:${color}">${r.fields.status || ''}</span>
                </div>
            </div>`;
        }).join('');
    }

    function openShot(r) {
        currentShot = r;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        vid.src = r.fields.preview_file2?.[0]?.url || "";
        vid.play().catch(() => {});
        document.getElementById('det-title').innerText = r.fields.shot_name;
        document.getElementById('det-ver').innerText = 'v' + String(r.fields.version || 0).padStart(3, '0');
        updateStatusBadge(r.fields.status);
        loadHistory(r.fields.shot_name);
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            if(document.body.classList.contains('fullscreen-active')) goFS();
            vid.pause(); document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    function updateStatusBadge(st) {
        const color = statusConfig[st?.toLowerCase()] || '#444';
        document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${color}">${st || 'No Status'}</div>`;
    }

    async function sendComment() {
        const input = document.getElementById('comm-text');
        if(!input.value) return;
        fetch(N8N_WEBHOOK, { method: 'POST', body: JSON.stringify({
            shot_id: currentShot.id, text: input.value, author: tg.initDataUnsafe?.user?.username || "User", new_status: "to fix"
        })});
        input.value = '';
        updateStatusBadge('to fix');
        tg.showAlert("Sent!");
    }

    async function loadHistory(name) {
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=`+encodeURIComponent(`{shot_name}='${name}'`), {
            headers: { Authorization: "Bearer " + TOKEN }
        });
        const data = await res.json();
        document.getElementById('history').innerHTML = (data.records || []).map(c => `
            <div class="history-item">${c.fields.text || ''}</div>
        `).join('');
    }

    function toggleP() { vid.paused ? vid.play() : vid.pause(); }
    function step(d) { vid.pause(); vid.currentTime += (1/24) * d; }

    // НОВЫЙ ФУЛЛСКРИН
    function goFS() {
        const body = document.body;
        if (!body.classList.contains('fullscreen-active')) {
            body.classList.add('fullscreen-active');
            // Попытка программно повернуть экран для Android
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        } else {
            body.classList.remove('fullscreen-active');
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }
    }

    init();
</script>
</body>
</html>
