<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Review</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        .st-review { color: #f1c40f; }
        .st-ready { color: #8e8e93; }
        .st-approved { color: #2ecc71; }
        .st-progress { color: #3498db; }
        .st-fix { color: #e67e22; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .refresh-btn { background: #1c1c1e; border: 1px solid #222; color: #007aff; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; }
        .refresh-btn:active { background: #3a3a3c; }
        
        .view-toggle { display: flex; gap: 5px; background: #1c1c1e; padding: 4px; border-radius: 10px; }
        .v-btn { border: none; background: none; color: #555; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .v-btn.active { background: #3a3a3c; color: #fff; }
        
        .filter-bar { display: flex; flex-direction: column; gap: 8px; padding: 0 15px 15px; border-bottom: 1px solid #222; }
        #tabs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
        #tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 18px; background: #1c1c1e; border-radius: 10px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }
        
        .status-filter-box { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8e8e93; }
        .status-select { background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; max-width: 150px; }
        
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: #1c1c1e; border-radius: 12px; overflow: hidden; border: 1px solid #222; position: relative; cursor: pointer; }
        
        .thumb-wrapper { width: 100%; aspect-ratio: 16/9; background: #111; position: relative; overflow: hidden; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .mini-preview-video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: block; }
        
        .info { padding: 12px; }
        
        .list-mode { display: flex !important; flex-direction: column !important; padding: 10px 12px !important; gap: 0 !important; }
        .list-mode .card { display: grid !important; grid-template-columns: 80px 1fr 105px; border: 1px solid #333; border-bottom: none; border-radius: 0; background: transparent; align-items: stretch; min-height: 55px; }
        .list-mode .card:first-child { border-radius: 8px 8px 0 0; }
        .list-mode .card:last-child { border-bottom: 1px solid #333; border-radius: 0 0 8px 8px; }
        .list-mode .thumb-wrapper { width: 100%; height: 100%; border-right: 1px solid #333; border-radius: 0; }
        .list-mode .info { display: contents; }
        .list-mode .info-name { padding: 10px 12px; border-right: 1px solid #333; font-size: 13px; font-weight: 700; display: flex; align-items: center; word-break: break-all; line-height: 1.2; }
        .list-mode .info-status { text-align: center; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 5px; text-transform: uppercase; }
        
        #player-view { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; overflow-y: auto; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; }
        #player-view video { width: 100%; height: 100%; display: block; }
        .p-nav { display: flex; justify-content: center; gap: 30px; padding: 20px; background: #111; border-bottom: 1px solid #222; }
        .p-btn { background: #222; border: none; color: #fff; width: 60px; height: 60px; border-radius: 16px; font-size: 24px; cursor: pointer; }
        .p-body { padding: 20px; }
        .video-loading { color: #8e8e93; font-size: 14px; font-weight: bold; }
        
        .comment-area { width: 100%; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; height: 100px; box-sizing: border-box; font-family: inherit; font-size: 16px; outline: none; }
        .submit-btn { width: 100%; background: #007aff; color: #fff; border: none; padding: 18px; border-radius: 12px; font-weight: 700; margin-top: 10px; font-size: 16px; cursor: pointer; }
        .submit-btn:disabled { background: #3a3a3c; color: #8e8e93; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="grid-view">
    <div class="header">
        <div class="header-left">
            <div id="project-name" style="font-weight:900; font-size:22px; text-transform: uppercase;">LOADING...</div>
            <button class="refresh-btn" onclick="fetchData()" title="Refresh records">🔄</button>
        </div>
        <div class="view-toggle">
            <button class="v-btn active" onclick="setView('grid', this)">田</button>
            <button class="v-btn" onclick="setView('list', this)">≡</button>
        </div>
    </div>
    
    <div class="filter-bar">
        <div id="tabs"></div>
        <div class="status-filter-box">
            <span>Status:</span>
            <select id="status-select" class="status-select" onchange="setStatusFilter(this.value)">
                <option value="">ALL</option>
                <option value="Review">REVIEW</option>
                <option value="In Progress">IN PROGRESS</option>
                <option value="To Fix">TO FIX</option>
                <option value="Ready to start">READY TO START</option>
                <option value="Approved">APPROVED</option>
            </select>
        </div>
    </div>
    
    <div id="main-grid">Loading grid data...</div>
</div>

<div id="player-view">
    <div class="video-box" id="v-container"></div>
    <div class="p-nav">
        <button class="p-btn" onclick="changeShot(-1)">⏮</button>
        <button class="p-btn" onclick="vToggle()">⏯</button>
        <button class="p-btn" onclick="changeShot(1)">⏭</button>
    </div>
    <div class="p-body">
        <h2 id="p-title" style="margin:0 0 5px 0;"></h2>
        <div id="p-meta" style="margin-bottom: 20px; font-size: 16px; font-weight: bold;"></div>
        <textarea id="comment-input" class="comment-area" placeholder="Write your comment here..."></textarea>
        <button id="comment-submit" class="submit-btn" onclick="sendComment()">SEND COMMENT</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    
    // ПЕРЕМЕННЫЕ ДЛЯ ТОКЕНОВ (Впиши свои актуальные ключи сюда перед деплоем)
    const AIRTABLE_KEY = 'patBsCg6ofoalEdYD.7fe0a35b60f18a67439ad759432ec5a063276df89842847200d6b9ec42224e79';
    const TG_BOT_TOKEN = '8573514570:AAFCUw5zcHANDYQofa21rLyqWEONat0t9hQ';
    
    const rawParam = tg.initDataUnsafe?.start_param || ""; 
    let CURRENT_BASE = 'appgiNHAoONgW8Ha6'; 
    let PROJECT_TITLE = 'BOGATYRI';

    if (rawParam) {
        if (rawParam.includes('_')) {
            const parts = rawParam.split('_');
            CURRENT_BASE = parts[0];
            PROJECT_TITLE = decodeURIComponent(parts[1]).toUpperCase();
        } else {
            CURRENT_BASE = rawParam;
            PROJECT_TITLE = "PROJECT: " + rawParam.substring(0, 8);
        }
    }

    let records = [];
    let filteredRecords = []; // Хранит отфильтрованный список шотов для навигации плеера
    let tgUrlsCache = {}; 
    let curEpFilter = '';
    let curStatusFilter = '';
    
    let activeRecordId = null;
    let activeRecordStatus = "";
    let activeRecordVersion = 0;

    const statusMap = { 'review': 'st-review', 'ready to start': 'st-ready', 'approved': 'st-approved', 'in progress': 'st-progress', 'to fix': 'st-fix' };
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    async function getTelegramVideoUrl(fileId) {
        if (tgUrlsCache[fileId]) return tgUrlsCache[fileId];
        try {
            const r = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/getFile?file_id=${fileId}`);
            const data = await r.json();
            if (data.ok && data.result.file_path) {
                const url = `https://api.telegram.org/file/bot${TG_BOT_TOKEN}/${data.result.file_path}`;
                tgUrlsCache[fileId] = url;
                return url;
            }
        } catch (e) {
            console.error("Telegram API Error:", e);
        }
        return null;
    }

    async function fetchData() {
        const grid = document.getElementById('main-grid');
        const refreshBtn = document.querySelector('.refresh-btn');
        if (refreshBtn) refreshBtn.style.opacity = '0.5';
        
        try {
            const r = await fetch(`https://api.airtable.com/v0/${CURRENT_BASE}/Shots?sort[0][field]=shot_name&sort[0][direction]=asc`, { 
                headers: { Authorization: `Bearer ${AIRTABLE_KEY}` } 
            });
            const json = await r.json();
            records = json.records || [];
            
            if (records.length > 0) {
                const eps = [...new Set(records.map(r => (r.fields.shot_name||"").split('_')[0].toLowerCase()))].filter(e=>e.startsWith('ep')).sort();
                if (eps.length > 0) {
                    if (!curEpFilter || !eps.includes(curEpFilter)) curEpFilter = eps[0];
                    document.getElementById('tabs').innerHTML = eps.map(ep => `
                        <div class="tab ${ep===curEpFilter?'active':''}" onclick="setEpFilter('${ep}', this)">${ep.toUpperCase()}</div>`).join('');
                }
                
                await preloadVideoUrls();
                render();
            } else {
                grid.innerText = "Base is empty. Add shots in Airtable.";
            }
        } catch(e) {
            grid.innerText = "Error loading database access.";
        } finally {
            if (refreshBtn) refreshBtn.style.opacity = '1';
        }
    }

    async function preloadVideoUrls() {
        const promises = records
            .filter(r => r.fields.tg_file_id && !tgUrlsCache[r.fields.tg_file_id])
            .map(r => getTelegramVideoUrl(r.fields.tg_file_id));
        await Promise.all(promises);
    }

    function init() {
        tg.expand();
        document.getElementById('project-name').innerText = PROJECT_TITLE;
        fetchData();
        
        setInterval(() => {
            if (document.getElementById('grid-view').style.display !== 'none') {
                fetchData();
            }
        }, 15 * 60 * 1000);
    }

    function setEpFilter(f, el) {
        curEpFilter = f;
        if(el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); }
        render();
    }

    function setStatusFilter(status) {
        curStatusFilter = status;
        render();
    }

    function setView(mode, el) {
        document.getElementById('main-grid').className = mode === 'list' ? 'list-mode' : '';
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function hoverPlay(videoEl) { if(!isMobile && videoEl) videoEl.play().catch(()=>{}); }
    function hoverPause(videoEl) { if(!isMobile && videoEl) { videoEl.pause(); videoEl.currentTime = 0; } }

    function render() {
        const grid = document.getElementById('main-grid');
        const isList = grid.classList.contains('list-mode');
        
        filteredRecords = records;
        if (curEpFilter) filteredRecords = filteredRecords.filter(r => (r.fields.shot_name||"").toLowerCase().startsWith(curEpFilter));
        if (curStatusFilter) filteredRecords = filteredRecords.filter(r => (r.fields.status || '') === curStatusFilter);
        
        if (filteredRecords.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #8e8e93; padding: 40px 0;">No shots found</div>`;
            return;
        }
        
        grid.innerHTML = filteredRecords.map(r => {
            const st = (r.fields.status || '').toLowerCase();
            const img = r.fields.thumbnail?.[0]?.url || '';
            const fileId = r.fields.tg_file_id;
            const videoUrl = fileId ? tgUrlsCache[fileId] : '';
            
            let mediaContent = `<img src="${img}" class="thumb">`;
            let hoverEvents = '';

            if (videoUrl) {
                if (isMobile) {
                    mediaContent = `<video class="mini-preview-video" loop muted playsinline autoplay><source src="${videoUrl}" type="video/mp4"></video>`;
                } else {
                    mediaContent = `<video class="mini-preview-video" loop muted playsinline><source src="${videoUrl}" type="video/mp4"></video>`;
                    hoverEvents = `onmouseenter="hoverPlay(this.querySelector('video'))" onmouseleave="hoverPause(this.querySelector('video'))"`;
                }
            }

            if (isList) {
                return `
                    <div class="card" ${hoverEvents} onclick='openPlayer("${r.id}")'>
                        <div class="thumb-wrapper">${mediaContent}</div>
                        <div class="info-name">${r.fields.shot_name}</div>
                        <div class="info-status ${statusMap[st]||''}">${(r.fields.status||'').toUpperCase()}</div>
                    </div>`;
            } else {
                return `
                    <div class="card" ${hoverEvents} onclick='openPlayer("${r.id}")'>
                        <div class="thumb-wrapper">${mediaContent}</div>
                        <div class="info">
                            <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${r.fields.shot_name}</div>
                            <div class="${statusMap[st]||''}" style="font-size:10px; font-weight:900; text-transform:uppercase;">${r.fields.status||''}</div>
                        </div>
                    </div>`;
            }
        }).join('');
    }

    async function openPlayer(id) {
        const r = records.find(rec => rec.id === id);
        if(!r) return;

        activeRecordId = id; 
        activeRecordStatus = r.fields.status || "";
        activeRecordVersion = r.fields.version ? Number(r.fields.version) : 0;
        
        document.getElementById('comment-input').value = ""; 
        document.getElementById('grid-view').style.display = 'none';
        document.getElementById('player-view').style.display = 'block';
        
        document.getElementById('p-title').innerText = r.fields.shot_name;
        const ver = `v${String(r.fields.version || 0).padStart(3, '0')}`;
        document.getElementById('p-meta').innerHTML = `<span style="color:#007aff">${ver}</span> | <span class="${statusMap[(r.fields.status||'').toLowerCase()] || ''}">${(r.fields.status || '').toUpperCase()}</span>`;
        
        const container = document.getElementById('v-container');
        container.innerHTML = `<div class="video-loading">CONNECTING TO TG CLOUD...</div>`;

        let videoUrl = r.fields.tg_file_id ? tgUrlsCache[r.fields.tg_file_id] : '';
        if (!videoUrl && r.fields.preview_file2 && r.fields.preview_file2[0]) {
            videoUrl = r.fields.preview_file2[0].url;
        }

        if (videoUrl) {
            container.innerHTML = `<video id="main-v" loop playsinline autoplay muted><source src="${videoUrl}" type="video/mp4"></video>`;
        } else {
            container.innerHTML = `<div class="video-loading" style="color:#ff3b30;">VIDEO NOT FOUND</div>`;
        }
        
        tg.BackButton.show();
    }

    tg.BackButton.onClick(() => {
        closePlayer();
    });

    function closePlayer() {
        document.getElementById('v-container').innerHTML = "";
        document.getElementById('player-view').style.display = 'none';
        document.getElementById('grid-view').style.display = 'block';
        tg.BackButton.hide();
        
        activeRecordId = null;
        activeRecordStatus = "";
        activeRecordVersion = 0;
        render();
    }

    // НАВИГАЦИЯ: Функция переключения между ШОТАМИ (Кнопки ⏮ и ⏭)
    function changeShot(direction) {
        if (!activeRecordId || filteredRecords.length <= 1) return;
        
        const currentIndex = filteredRecords.findIndex(r => r.id === activeRecordId);
        let nextIndex = currentIndex + direction;
        
        if (nextIndex < 0) nextIndex = filteredRecords.length - 1;
        if (nextIndex >= filteredRecords.length) nextIndex = 0;
        
        openPlayer(filteredRecords[nextIndex].id);
    }

    // НАВИГАЦИЯ: Функция ПОКАДРОВОГО сдвига видео (Клавиатура)
    function frameStep(d) { 
        const v = document.getElementById('main-v'); 
        if(v) { 
            v.pause(); 
            v.currentTime += d * (1/24); 
        } 
    }

    function vToggle() { const v = document.getElementById('main-v'); if(v) v.paused ? v.play() : v.pause(); }

    async function sendComment() {
        const inputEl = document.getElementById('comment-input');
        const submitBtn = document.getElementById('comment-submit');
        const text = inputEl.value.trim();
        
        if (!text || !activeRecordId) return;

        submitBtn.disabled = true;
        submitBtn.innerText = "SENDING...";

        const username = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Unknown Producer";

        const payload = {
            fields: {
                "notes": text,
                "shot_name": [activeRecordId], 
                "artist": username,
                "status": activeRecordStatus,
                "version": activeRecordVersion
            }
        };

        try {
            const response = await fetch(`https://api.airtable.com/v0/${CURRENT_BASE}/Comments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${AIRTABLE_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                inputEl.value = "";
                tg.showAlert("Comment successfully added!");
            } else {
                const errData = await response.json();
                console.error("Airtable Error Response:", errData);
                tg.showAlert(`Failed to save comment. Check if the table "Comments" has column types matching: notes, shot_name, artist, status, version.`);
            }
        } catch (e) {
            console.error("Network Error:", e);
            tg.showAlert("Network error. Could not send comment.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "SEND COMMENT";
        }
    }

    // Слушатель горячих клавиш для десктопного ревью
    window.addEventListener('keydown', (e) => {
        if (document.getElementById('player-view').style.display === 'block') {
            // Если фокус в поле ввода коммента — горячие клавиши блокируются
            if (document.activeElement.id === 'comment-input') return;

            if (e.key === 'ArrowRight') frameStep(1);
            if (e.key === 'ArrowLeft') frameStep(-1);
            if (e.key === ' ') { 
                e.preventDefault(); 
                vToggle(); 
            }
        }
    });
    
    init();
</script>
</body>
</html>
