<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Review</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        
        .st-review { color: #f1c40f; }
        .st-ready { color: #8e8e93; }
        .st-approved { color: #2ecc71; }
        .st-progress { color: #3498db; }
        .st-fix { color: #e67e22; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .view-toggle { display: flex; gap: 5px; background: #1c1c1e; padding: 4px; border-radius: 10px; }
        .v-btn { border: none; background: none; color: #555; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .v-btn.active { background: #3a3a3c; color: #fff; }

        #tabs { display: flex; gap: 10px; padding: 0 15px 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #222; min-height: 40px; }
        .tab { padding: 8px 18px; background: #1c1c1e; border-radius: 10px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }

        /* GRID */
        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 15px; }
        .card-grid { background: #1c1c1e; border-radius: 12px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        .card-grid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; }
        .card-grid .info { padding: 10px; }

        /* LIST (TABLE) */
        .list-mode { display: flex !important; flex-direction: column !important; padding: 10px 15px !important; gap: 0 !important; }
        .card-list { 
            display: grid !important; 
            grid-template-columns: 80px 1fr 65px 105px; 
            border: 1px solid #333; 
            border-bottom: none; 
            background: transparent;
            align-items: stretch;
            min-height: 50px;
        }
        .card-list:first-child { border-radius: 8px 8px 0 0; }
        .card-list:last-child { border-bottom: 1px solid #333; border-radius: 0 0 8px 8px; }
        .card-list img { width: 100%; height: 100%; border-right: 1px solid #333; object-fit: cover; background: #111; }
        .list-name { padding: 8px 12px; border-right: 1px solid #333; font-size: 13px; font-weight: 700; display: flex; align-items: center; line-height: 1.2; word-break: break-all; }
        .list-ver { border-right: 1px solid #333; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #007aff; font-weight: 700; }
        .list-status { text-align: center; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 5px; text-transform: uppercase; }

        /* Player */
        #player-view { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; display: block; }
        .p-nav { display: flex; justify-content: center; gap: 30px; padding: 20px; background: #111; border-bottom: 1px solid #222; }
        .p-btn { background: #222; border: none; color: #fff; width: 60px; height: 60px; border-radius: 16px; font-size: 24px; transition: 0.1s; outline: none; -webkit-tap-highlight-color: transparent; }
        .p-btn:active { background: #fff !important; color: #000 !important; }
        .p-body { padding: 20px; }
    </style>
</head>
<body>

<div id="home-view">
    <div class="header">
        <div style="font-weight:900; font-size:22px;">БОГАТЫРИ</div>
        <div class="view-toggle">
            <button id="btn-grid" class="v-btn active" onclick="setView('grid')">田</button>
            <button id="btn-list" class="v-btn" onclick="setView('list')">≡</button>
        </div>
    </div>
    <div id="tabs"></div>
    <div id="main-grid">Загрузка данных...</div>
</div>

<div id="player-view">
    <div class="video-box" id="v-container"></div>
    <div class="p-nav">
        <button class="p-btn" onclick="vStep(-1)">⏮</button>
        <button class="p-btn" onclick="vToggle()">⏯</button>
        <button class="p-btn" onclick="vStep(1)">⏭</button>
    </div>
    <div class="p-body">
        <h2 id="p-title" style="margin:0 0 5px 0;"></h2>
        <div id="p-meta" style="margin-bottom: 20px; font-size: 16px; font-weight: bold;"></div>
        <textarea id="p-comm" style="width:100%; background:#1c1c1e; border:1px solid #333; color:#fff; padding:15px; border-radius:12px; height:100px; box-sizing:border-box; font-family:inherit; font-size:16px;" placeholder="Ваш комментарий..."></textarea>
        <button style="width:100%; background:#007aff; color:#fff; border:none; padding:18px; border-radius:12px; font-weight:700; margin-top:10px; font-size:16px;">ОТПРАВИТЬ</button>
    </div>
</div>
