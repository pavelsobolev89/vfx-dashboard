<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        .project-header { padding: 15px 15px 5px 15px; font-size: 20px; font-weight: 900; color: #fff; text-transform: uppercase; }
        #tabs-bar { display: flex; overflow-x: auto; padding: 10px; gap: 6px; background: #000; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
        .tab { padding: 6px 14px; background: #1c1c1e; border-radius: 8px; font-size: 12px; white-space: nowrap; cursor: pointer; color: #8e8e93; border: 1px solid transparent; }
        .tab.active { background: #007aff; color: #fff; border-color: #007aff; }

        #main-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 15px; }
        .card { background: #1c1c1e; border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .v-tag { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        
        /* Плеер без нативного управления */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: auto; }
        .player-block { position: sticky; top: 0; z-index: 110; background: #000; }
        video { width: 100%; max-width: 1000px; display: block; margin: 0 auto; background: #000; }
        
        /* Твои компактные кнопки */
        .custom-controls { 
            display: flex; justify-content: center; align-items: center; gap: 10px; 
            padding: 8px; background: #111; border-bottom: 1px solid #222; 
        }
        .p-btn { 
            background: #2c2c2e; border: none; color: #fff; 
            width: 32px; height: 32px; border-radius: 6px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            font-size: 14px; transition: 0.1s;
        }
        .p-btn:hover { background: #3a3a3c; }
        .play-btn { background: #007aff; width: 40px; }
        .fs-btn { background: none; color: #666; font-size: 16px; margin-left: 10px; }

        .info-panel { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 5px; font-size: 10px; text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }
        
        .comment-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .comment-input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 10px 15px; border-radius: 10px; outline: none; }
        .send-btn { background: #007aff; border: none; color: #fff; padding: 0 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .history-item { background: #1c1c1e; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 3px solid #444; font-size: 13px; }
    </style>
</head>
<body>

<div id="list-view">
    <div class="project-header">БОГАТЫРИ</div>
    <div id="tabs-bar"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="detail-view">
    <div class="player-block">
        <video id="main-v" loop playsinline></video>
        <div class="custom-controls">
            <button class="p-btn" title="Frame Back" onclick="step(-1)">⏮</button>
            <button class="p-btn play-btn" title="Play/Pause" onclick="toggleP()">⏯</button>
            <button class="p-btn" title="Frame Forward" onclick="step(1)">⏭</button>
            <button class="p-btn fs-btn" title="Full Screen" onclick="goFS()">⛶</button>
        </div>
    </div>

    <div class="info-panel">
        <h2 id="det-title" style="margin:0;"></h2>
        <div id="det-ver" style="color:#007aff; font-weight:bold; margin: 5px 0 10px 0;"></div>
        <div id="det-status"></div>
        
        <div class="comment-box">
            <input type="text" id="comm-text" class="comment-input" placeholder="Leave your comment">
            <button class="send-btn" onclick="sendComment()">Send</button>
        </div>
        
        <div id="history"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const N8N_WEBHOOK = 'ТВОЙ_N8N_URL'; // ВСТАВЬ СЮДА ССЫЛКУ

    let allRecords = [];
    let currentShot = null;

    async function init() {
        const r = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, { headers: { Authorization: "Bearer " + TOKEN } });
        const data = await r.json();
        allRecords = data.records || [];
        renderTabs();
    }

    function renderTabs() {
        const bar = document.getElementById('tabs-bar');
        const eps = [...new Set(allRecords.map(r => (r.fields.shot_name || "").substring(0, 4).toLowerCase()))].filter(e => e.startsWith('ep')).sort();
        bar.innerHTML = eps.map((ep, i) => `<div class="tab ${i===0?'active':''}" onclick="renderGrid('${ep}'); selectTab(this)">${ep.toUpperCase()}</div>`).join('');
        if(eps.length > 0) renderGrid(eps[0]);
    }

    function selectTab(el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function renderGrid(filter) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = allRecords.filter(r => (r.fields.shot_name || "").toLowerCase().startsWith(filter)).map(r => `
            <div class="card" onclick='openShot(${JSON.stringify(r)})'>
                <div class="v-tag">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                <div style="padding:10px; font-size:11px;">
                    <b>${r.fields.shot_name}</b><br>
                    <span style="color:#007aff">${r.fields.status || ''}</span>
                </div>
            </div>
        `).join('');
    }

    function openShot(r) {
        currentShot = r;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        const v = document.getElementById('main-v');
        v.src = r.fields.preview_file2?.[0]?.url || "";
        v.play();

        document.getElementById('det-title').innerText = r.fields.shot_name;
        document.getElementById('det-ver').innerText = 'v' + String(r.fields.version || 0).padStart(3, '0');
        updateStatusBadge(r.fields.status);
        loadHistory(r.fields.shot_name);

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            v.pause(); document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    function updateStatusBadge(st) {
        const col = st?.toLowerCase() === 'to fix' ? '#e67e22' : '#007aff';
        document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${col}">${st || 'No Status'}</div>`;
    }

    async function sendComment() {
        const txt = document.getElementById('comm-text').value;
        if(!txt) return;
        
        // 1. Отправляем в n8n для смены статуса в базе
        fetch(N8N_WEBHOOK, { method: 'POST', body: JSON.stringify({
            shot_id: currentShot.id,
            text: txt,
            author: tg.initDataUnsafe?.user?.username || "Super",
            new_status: "to fix"
        })});

        // 2. Мгновенно обновляем интерфейс
        document.getElementById('comm-text').value = '';
        updateStatusBadge('to fix');
        tg.showAlert("Status changed to To Fix");
    }

    async function loadHistory(name) {
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=`+encodeURIComponent(`{shot_name}='${name}'`), {
            headers: { Authorization: "Bearer " + TOKEN }
        });
        const data = await res.json();
        document.getElementById('history').innerHTML = (data.records || []).map(c => `
            <div class="history-item">
                <div style="font-size:10px; color:#8e8e93; margin-bottom:4px;"><b>${c.fields.author || 'Super'}</b></div>
                ${c.fields.text || ''}
            </div>
        `).join('');
    }

    const vid = document.getElementById('main-v');
    function toggleP() { vid.paused ? vid.play() : vid.pause(); }
    function step(d) { vid.pause(); vid.currentTime += (1/24) * d; }
    function goFS() { if(vid.requestFullscreen) vid.requestFullscreen(); else if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); }

    init();
</script>
</body>
</html>
