<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Pipeline OS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #1c1c1d; --card: #2c2c2e; --accent: #0a84ff; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        
        /* ГЛАВНЫЙ ЭКРАН */
        #list-view { padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
        .card-info { padding: 10px; font-size: 12px; }

        /* ЭКРАН ДЕТАЛЕЙ */
        #detail-view { display: none; min-height: 100vh; }
        .hero-preview { width: 100%; aspect-ratio: 16/9; background: #000; object-fit: contain; }
        .detail-content { padding: 20px; }
        .comment-block { background: var(--card); border-radius: 10px; padding: 12px; margin-top: 10px; border-left: 3px solid var(--accent); }
        .comment-meta { font-size: 11px; color: #8e8e93; margin-bottom: 4px; }
        .version-tag { background: #3a3a3c; padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--accent); }
        
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <div id="list-view">
        <div id="main-grid" class="grid">
            <div class="loading">Загрузка проектов...</div>
        </div>
    </div>

    <div id="detail-view">
        <img id="detail-img" src="" class="hero-preview">
        <div class="detail-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="detail-title" style="margin:0;"></h2>
                <span id="detail-ver" class="version-tag"></span>
            </div>
            <p id="detail-status" style="color:var(--accent); margin: 10px 0; font-size: 14px;"></p>
            <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
            <h3>История правок</h3>
            <div id="comments-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- НАСТРОЙКИ (ВСТАВЬ СВОИ ДАННЫЕ) ---
        const TOKEN = 'patBsCg6ofoalEdYD.553cfd245cc80e905db392a808d7b82a52f8cef276a6601493da22552e85867f';
        const BASE = 'appgiNHAoONgW8Ha6';

        // Загрузка списка шотов
        async function loadShots() {
            try {
                const resp = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, {
                    headers: { Authorization: `Bearer ${TOKEN}` }
                });
                const data = await resp.json();
                renderGrid(data.records);
            } catch (e) {
                console.error("Ошибка сети:", e);
            }
        }

        function renderGrid(records) {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            records.forEach(r => {
                const f = r.fields;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openShot(r); // Клик открывает детали
                card.innerHTML = `
                    <img src="${(f.thumbnail && f.thumbnail[0].url) || ''}" class="thumb">
                    <div class="card-info">
                        <b>${f.shot_name || 'Shot'}</b><br>
                        <span style="color:#8e8e93">${f.status || 'Draft'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ТА САМАЯ ФУНКЦИЯ ДЛЯ ОТКРЫТИЯ ДЕТАЛЕЙ И КОММЕНТОВ
        async function openShot(record) {
            const f = record.fields;
            const shotName = f.shot_name;

            // 1. Переключаем экраны
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';

            // 2. Заполняем базу
            document.getElementById('detail-title').innerText = shotName;
            document.getElementById('detail-status').innerText = f.status || 'Reviewing';
            document.getElementById('detail-ver').innerText = f.version || 'v001';
            document.getElementById('detail-img').src = (f.thumbnail && f.thumbnail[0].url) || '';

            // 3. Грузим комменты
            const commentsDiv = document.getElementById('comments-list');
            commentsDiv.innerHTML = '<div class="loading">Ищем правки...</div>';

            try {
                const filter = encodeURIComponent(`{shot_name}='${shotName}'`);
                const resp = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=${filter}`, {
                    headers: { Authorization: `Bearer ${TOKEN}` }
                });
                const data = await resp.json();
                
                commentsDiv.innerHTML = '';
                if (data.records && data.records.length > 0) {
                    data.records.forEach(c => {
                        const cf = c.fields;
                        commentsDiv.innerHTML += `
                            <div class="comment-block">
                                <div class="comment-meta">${cf.author || 'Super'} • ${cf.version || 'v001'}</div>
                                <div>${cf.text || ''}</div>
                            </div>
                        `;
                    });
                } else {
                    commentsDiv.innerHTML = '<div style="color:#666">Правок пока нет. Всё чисто!</div>';
                }
            } catch (err) {
                commentsDiv.innerHTML = '<div style="color:red">Ошибка загрузки комментов.</div>';
            }

            // 4. Показываем кнопку НАЗАД
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                document.getElementById('detail-view').style.display = 'none';
                document.getElementById('list-view').style.display = 'block';
                tg.BackButton.hide();
            });
        }

        loadShots();
    </script>
</body>
</html>
