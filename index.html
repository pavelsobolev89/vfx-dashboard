<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui; background: #000; color: #fff; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Шапка */
        .project-header { padding: 15px 15px 5px 15px; font-size: 22px; font-weight: 900; color: #fff; }
        #tabs-bar { display: flex; overflow-x: auto; padding: 10px; gap: 8px; background: #000; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
        .tab { padding: 8px 16px; background: #1c1c1e; border-radius: 12px; font-size: 13px; white-space: nowrap; color: #8e8e93; }
        .tab.active { background: #007aff; color: #fff; }

        /* Сетка */
        #main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #1c1c1e; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #222; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .v-tag { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        
        /* Детальный вид и Плеер */
        #detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: auto; }
        
        /* Фиксированная верхняя часть в плеере */
        .sticky-player { position: sticky; top: 0; z-index: 110; background: #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .video-wrapper { width: 100%; background: #000; line-height: 0; }
        video { width: 100%; display: block; }
        
        /* Пульт управления (всегда виден) */
        .player-controls { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            padding: 15px 0; 
            background: #111; 
            border-bottom: 1px solid #222;
        }
        .p-btn { 
            background: #2c2c2e; 
            border: none; 
            color: #fff; 
            width: 54px; 
            height: 54px; 
            border-radius: 50%; 
            font-size: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
        }
        .p-btn:active { background: #3a3a3c; transform: scale(0.95); }
        .fs-btn { background: none; color: #8e8e93; font-size: 20px; width: auto; height: auto; }

        /* Контент под плеером */
        .info-panel { padding: 20px 15px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 10px; }

        /* Комментарии */
        .comment-area { display: flex; gap: 8px; margin-top: 15px; }
        .comment-input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; outline: none; font-size: 15px; }
        .send-btn { background: #007aff; border: none; color: #fff; border-radius: 10px; padding: 0 20px; font-weight: bold; }
        
        .history-card { background: #1c1c1e; padding: 12px; border-radius: 10px; margin-top: 10px; border-left: 3px solid #333; font-size: 14px; }
        .history-meta { font-size: 10px; color: #8e8e93; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="list-view">
    <div class="project-header" id="proj-title">PROJECT</div>
    <div id="tabs-bar"></div>
    <div id="main-grid">Загрузка...</div>
</div>

<div id="detail-view">
    <div class="sticky-player">
        <div class="video-wrapper">
            <video id="main-v" loop playsinline></video>
        </div>
        <div class="player-controls">
            <button class="p-btn" onclick="step(-1)">⏮</button>
            <button class="p-btn" style="background:#fff; color:#000;" onclick="toggleP()">⏯</button>
            <button class="p-btn" onclick="step(1)">⏭</button>
            <button class="p-btn fs-btn" onclick="goFS()">⛶</button>
        </div>
    </div>

    <div class="info-panel">
        <h2 id="det-title" style="margin:0; font-size: 24px;"></h2>
        <div id="det-ver" style="color:#007aff; font-weight:bold; margin: 5px 0 10px 0;"></div>
        <div id="det-status"></div>
        
        <div class="comment-area">
            <input type="text" id="comm-text" class="comment-input" placeholder="Leave your comment">
            <button class="send-btn" onclick="sendComment()">Send</button>
        </div>
        
        <div id="history-list" style="margin-top:30px; padding-bottom: 100px;"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const PROJECT_NAME = "Богатыри"; 
    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const N8N_WEBHOOK = 'ТВОЙ_N8N_URL'; 

    document.getElementById('proj-title').innerText = PROJECT_NAME;

    const statusColors = {
        'ready to start': '#808080', 'in progress': '#3498db',
        'pause': '#9b59b6', 'to fix': '#e67e22',
        'review': '#f1c40f', 'send to client': '#1abc9c', 'approved': '#2ecc71'
    };

    let allRecords = [];
    let currentShot = null;

    async function init() {
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Shots`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        const data = await res.json();
        allRecords = data.records || [];
        renderTabs();
    }

    function renderTabs() {
        const bar = document.getElementById('tabs-bar');
        const eps = [...new Set(allRecords.map(r => {
            const n = r.fields.shot_name || "";
            return n.toString().substring(0, 4).toLowerCase();
        }))].filter(e => e.startsWith('ep')).sort();
        
        bar.innerHTML = '';
        eps.forEach((ep, i) => {
            const t = document.createElement('div');
            t.className = 'tab' + (i === 0 ? ' active' : '');
            t.innerText = ep.toUpperCase();
            t.onclick = () => {
                document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
                t.classList.add('active');
                renderGrid(ep);
            };
            bar.appendChild(t);
        });
        if(eps.length > 0) renderGrid(eps[0]);
    }

    function renderGrid(filter) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = allRecords
            .filter(r => (r.fields.shot_name || "").toLowerCase().startsWith(filter))
            .map(r => `
                <div class="card" onclick='openShot(${JSON.stringify(r)})'>
                    <div class="v-tag">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                    <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="thumb">
                    <div style="padding:10px">
                        <div style="font-size:12px; font-weight:bold;">${r.fields.shot_name}</div>
                        <div class="status-badge" style="background:${statusColors[r.fields.status?.toLowerCase()] || '#333'}">${r.fields.status}</div>
                    </div>
                </div>
            `).join('');
    }

    function openShot(r) {
        currentShot = r;
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('detail-view').style.display = 'block';
        
        const v = document.getElementById('main-v');
        v.src = r.fields.preview_file2?.[0]?.url || "";
        v.play().catch(() => {});

        document.getElementById('det-title').innerText = r.fields.shot_name;
        document.getElementById('det-ver').innerText = 'Version: v' + String(r.fields.version || 0).padStart(3, '0');
        
        const sCol = statusColors[r.fields.status?.toLowerCase()] || '#333';
        document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${sCol}">${r.fields.status}</div>`;

        loadHistory(r.fields.shot_name);

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            v.pause(); v.src = "";
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    async function sendComment() {
        const input = document.getElementById('comm-text');
        const text = input.value.trim();
        if(!text) return;

        const payload = {
            shot_id: currentShot.id,
            shot_name: currentShot.fields.shot_name,
            version: currentShot.fields.version,
            text: text,
            author: tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "User",
            new_status: "to fix"
        };

        try {
            const res = await fetch(N8N_WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                input.value = '';
                tg.showAlert("Sent! Status: To Fix");
                document.getElementById('det-status').innerHTML = `<div class="status-badge" style="background:${statusColors['to fix']}">to fix</div>`;
                loadHistory(currentShot.fields.shot_name);
            }
        } catch (e) { alert("Error"); }
    }

    async function loadHistory(shotName) {
        const hList = document.getElementById('history-list');
        hList.innerHTML = 'Loading history...';
        const filter = encodeURIComponent(`{shot_name}='${shotName}'`);
        const res = await fetch(`https://api.airtable.com/v0/${BASE}/Comments?filterByFormula=${filter}&sort[0][field]=Created&sort[0][direction]=desc`, {
            headers: { Authorization: `Bearer ${TOKEN}` }
        });
        const data = await res.json();
        hList.innerHTML = '<h4 style="margin-bottom:10px;">History</h4>';
        data.records.forEach(c => {
            const div = document.createElement('div');
            div.className = 'history-card';
            div.innerHTML = `<div class="history-meta">${c.fields.author || 'User'} • v${String(c.fields.version || 0).padStart(3, '0')}</div>${c.fields.text || ''}`;
            hList.appendChild(div);
        });
    }

    // Плеер (24 fps)
    const vid = document.getElementById('main-v');
    function toggleP() { vid.paused ? vid.play() : vid.pause(); }
    function step(d) { vid.pause(); vid.currentTime += (1/24) * d; }
    function goFS() {
        if (vid.requestFullscreen) vid.requestFullscreen();
        else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
    }

    init();
</script>
</body>
</html>
