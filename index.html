<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Storage</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .v-controls { display: flex; gap: 5px; background: #1c1c1e; padding: 4px; border-radius: 10px; }
        .v-btn { border: none; background: none; color: #555; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .v-btn.active { background: #3a3a3c; color: #fff; }
        #tabs { display: flex; gap: 10px; padding: 0 15px 15px; overflow-x: auto; scrollbar-width: none; }
        .tab { padding: 8px 18px; background: #1c1c1e; border-radius: 10px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }

        /* GRID / LIST */
        #main-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 15px; }
        .item-card { background: #151515; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .item-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .item-info { padding: 10px; }
        
        .list-view { display: flex !important; flex-direction: column !important; }
        .list-view .item-card { display: flex; align-items: center; padding: 8px 15px; height: 50px; }
        .list-view .item-thumb { width: 70px; height: 40px; margin-right: 15px; border-radius: 4px; }
        .list-view .item-info { display: flex; flex: 1; justify-content: space-between; align-items: center; padding: 0; }

        /* PLAYER */
        #player-page { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .p-nav { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #111; }
        .p-btn { background: #222; border: none; color: #fff; width: 50px; height: 50px; border-radius: 12px; font-size: 20px; }
        .p-content { padding: 20px; }
    </style>
</head>
<body>

<div id="home">
    <div class="header">
        <div style="font-weight:900; font-size:20px;">БОГАТЫРИ</div>
        <div class="v-controls">
            <button class="v-btn active" onclick="setView('grid', this)">田</button>
            <button class="v-btn" onclick="setView('list', this)">≡</button>
        </div>
    </div>
    <div id="tabs"></div>
    <div id="main-container"></div>
</div>

<div id="player-page">
    <video id="v-player" loop playsinline autoplay muted></video>
    <div class="p-nav">
        <button class="p-btn" onclick="vStep(-1)">⏮</button>
        <button class="p-btn" onclick="vPlay()">⏯</button>
        <button class="p-btn" onclick="vStep(1)">⏭</button>
    </div>
    <div class="p-content">
        <h2 id="p-name" style="margin:0"></h2>
        <div id="p-meta" style="margin: 10px 0 20px 0; color: #007aff; font-weight: bold;"></div>
        <textarea id="p-comm" style="width:100%; background:#1c1c1e; border:1px solid #333; color:#fff; padding:15px; border-radius:12px; height:100px; font-family:inherit;" placeholder="Комментарий..."></textarea>
        <button style="width:100%; background:#007aff; color:#fff; border:none; padding:15px; border-radius:12px; font-weight:700; margin-top:10px;">ОТПРАВИТЬ</button>
        <div id="p-history" style="margin-top:20px"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const AIR_KEY = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE_ID = 'appgiNHAoONgW8Ha6';
    
    let data = [];
    let currentFilter = '';

    async function load() {
        const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/Shots?sort[0][field]=shot_name&sort[0][direction]=asc`, {
            headers: { Authorization: `Bearer ${AIR_KEY}` }
        });
        const json = await res.json();
        data = json.records || [];
        
        const eps = [...new Set(data.map(r => (r.fields.shot_name||"").split('_')[0].toLowerCase()))].filter(e=>e.startsWith('ep')).sort();
        document.getElementById('tabs').innerHTML = eps.map((ep, i) => `<div class="tab ${i===0?'active':''}" onclick="setEp('${ep}', this)">${ep.toUpperCase()}</div>`).join('');
        if(eps.length > 0) setEp(eps[0]);
    }

    function setEp(ep, el) {
        currentFilter = ep;
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        render();
    }

    function setView(mode, el) {
        document.getElementById('main-container').className = mode === 'list' ? 'list-view' : '';
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function render() {
        const cont = document.getElementById('main-container');
        cont.innerHTML = data.filter(r => (r.fields.shot_name||"").toLowerCase().startsWith(currentFilter)).map(r => `
            <div class="item-card" onclick='openPlayer(${JSON.stringify(r)})'>
                <img src="${r.fields.thumbnail?.[0]?.url || ''}" class="item-thumb">
                <div class="item-info">
                    <div style="font-weight:700; font-size:14px;">${r.fields.shot_name}</div>
                    <div style="color:#007aff; font-size:12px;">v${String(r.fields.version || 0).padStart(3, '0')}</div>
                    <div style="font-size:10px; font-weight:900; text-transform:uppercase;">${r.fields.status || ''}</div>
                </div>
            </div>`).join('');
    }

    async function openPlayer(r) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('player-page').style.display = 'block';
        
        const v = document.getElementById('v-player');
        v.src = r.fields.preview_file || ""; // Прямая ссылка из Shots
        
        document.getElementById('p-name').innerText = r.fields.shot_name;
        document.getElementById('p-meta').innerText = `v${String(r.fields.version || 0).padStart(3, '0')} | ${r.fields.status || ''}`;

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            v.pause(); v.src = "";
            document.getElementById('player-page').style.display = 'none';
            document.getElementById('home').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    function vPlay() { const v = document.getElementById('v-player'); v.paused ? v.play() : v.pause(); }
    function vStep(d) { const v = document.getElementById('v-player'); v.pause(); v.currentTime += d * (1/24); }

    load();
</script>
</body>
</html>
