<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VFX Storage</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .project-title { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        
        .view-controls { display: flex; gap: 5px; background: #1c1c1e; padding: 4px; border-radius: 10px; }
        .v-btn { border: none; background: none; color: #555; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .v-btn.active { background: #3a3a3c; color: #fff; }

        #tabs { display: flex; gap: 10px; padding: 0 15px 15px; overflow-x: auto; scrollbar-width: none; }
        #tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 18px; background: #1c1c1e; border-radius: 10px; font-size: 13px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
        .tab.active { background: #007aff; color: #fff; }

        /* GRID MODE */
        #main-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 15px; }
        .item-card { background: #151515; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #222; }
        .item-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #111; }
        .item-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; }
        
        /* LIST MODE FIX */
        #main-container.list-view { display: flex; flex-direction: column; gap: 8px; }
        .list-view .item-card { flex-direction: row; align-items: center; padding: 8px 12px; }
        .list-view .item-thumb { width: 70px; height: 40px; border-radius: 6px; flex-shrink: 0; }
        .list-view .item-info { flex-direction: row; flex: 1; align-items: center; justify-content: space-between; padding: 0 0 0 12px; gap: 10px; }
        
        .item-name { font-weight: 700; font-size: 14px; color: #fff; word-break: break-all; }
        .item-ver { color: #007aff; font-weight: 700; font-size: 13px; }
        .item-status { font-weight: 900; font-size: 10px; text-transform: uppercase; text-align: right; min-width: 70px; }

        /* PLAYER PAGE */
        #player-page { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; overflow-y: auto; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #111; display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; }
        
        .tg-link-btn { background: #0088cc; color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }

        .p-content { padding: 20px; }
        .p-nav { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #111; border-bottom: 1px solid #222; }
        .p-btn { background: #222; border: none; color: #fff; width: 50px; height: 50px; border-radius: 12px; font-size: 20px; }
    </style>
</head>
<body>

<div id="app-home">
    <div class="header">
        <div class="project-title">БОГАТЫРИ</div>
        <div class="view-controls">
            <button class="v-btn active" onclick="changeView('grid', this)">田</button>
            <button class="v-btn" onclick="changeView('list', this)">≡</button>
        </div>
    </div>
    <div id="tabs"></div>
    <div id="main-container">Загрузка...</div>
</div>

<div id="player-page">
    <div class="video-box" id="video-box">
        <video id="v-player" controls playsinline></video>
    </div>
    
    <div class="p-nav">
        <button class="p-btn" onclick="vStep(-1)">⏮</button>
        <button class="p-btn" onclick="vPlay()">⏯</button>
        <button class="p-btn" onclick="vStep(1)">⏭</button>
    </div>

    <div class="p-content">
        <h2 id="p-name" style="margin:0 0 10px 0; font-size: 22px;"></h2>
        <div id="p-meta" style="margin-bottom:20px"></div>
        
        <textarea id="p-comm" style="width:100%; background:#1c1c1e; border:1px solid #333; color:#fff; padding:15px; border-radius:12px; height:100px; box-sizing:border-box; font-family: inherit;" placeholder="Ваш комментарий..."></textarea>
        <button onclick="sendComment()" style="width:100%; background:#007aff; color:#fff; border:none; padding:18px; border-radius:12px; font-weight:700; margin-top:10px; font-size: 16px;">ОТПРАВИТЬ</button>
        
        <div id="p-history" style="margin-top:30px"></div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const AIR_KEY = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE_ID = 'appgiNHAoONgW8Ha6';
    
    const statusMap = { 'ready to start': '#888', 'review': '#f1c40f', 'approved': '#2ecc71', 'to fix': '#e67e22', 'in progress': '#3498db' };

    let data = [];
    let currentEp = '';
    let currentShotId = null;

    async function load() {
        tg.expand();
        try {
            const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/Shots?sort[0][field]=shot_name&sort[0][direction]=asc`, {
                headers: { Authorization: `Bearer ${AIR_KEY}` }
            });
            const json = await res.json();
            data = json.records || [];
            
            const eps = [...new Set(data.map(r => r.fields.shot_name.split('_')[0].toUpperCase()))].sort();
            document.getElementById('tabs').innerHTML = eps.map((ep, i) => 
                `<div class="tab ${i===0?'active':''}" onclick="setEp('${ep}', this)">${ep}</div>`
            ).join('');
            
            if(eps.length > 0) setEp(eps[0]);
        } catch(e) { document.getElementById('main-container').innerText = "Ошибка загрузки"; }
    }

    function setEp(ep, el) {
        currentEp = ep;
        if(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }
        render();
    }

    function changeView(mode, el) {
        const container = document.getElementById('main-container');
        document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        container.className = mode === 'list' ? 'list-view' : '';
    }

    function render() {
        const container = document.getElementById('main-container');
        const filtered = data.filter(r => r.fields.shot_name.toUpperCase().startsWith(currentEp));
        
        container.innerHTML = filtered.map(r => {
            const f = r.fields;
            const stColor = statusMap[f.status?.toLowerCase()] || '#fff';
            const ver = 'v' + String(f.version || 0).padStart(3, '0');
            return `
                <div class="item-card" onclick="openPlayer('${r.id}')">
                    <img src="${f.thumbnail?.[0]?.url || ''}" class="item-thumb">
                    <div class="item-info">
                        <div class="item-name">${f.shot_name}</div>
                        <div class="item-ver">${ver}</div>
                        <div class="item-status" style="color:${stColor}">${f.status || ''}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function openPlayer(id) {
        const shot = data.find(r => r.id === id);
        currentShotId = id;
        const player = document.getElementById('v-player');
        const vBox = document.getElementById('video-box');
        
        document.getElementById('app-home').style.display = 'none';
        document.getElementById('player-page').style.display = 'block';
        document.getElementById('p-name').innerText = shot.fields.shot_name;
        
        // ССЫЛКА ИЗ ТАБЛИЦЫ SHOTS ПОЛЕ preview_file
        const videoUrl = shot.fields.preview_file || "";
        
        if (videoUrl.includes('t.me/')) {
            // Если это ссылка на пост в ТГ, браузерный плеер её не поймет.
            // Показываем кнопку перехода, пока не настроен прокси для видео.
            vBox.innerHTML = `<a href="${videoUrl}" target="_blank" class="tg-link-btn">Открыть видео в Telegram</a>`;
        } else {
            vBox.innerHTML = `<video id="v-player" controls playsinline src="${videoUrl}"></video>`;
        }

        // Загрузка истории комментов
        const cRes = await fetch(`https://api.airtable.com/v0/${BASE_ID}/Comments?filterByFormula={shot_name}='${shot.fields.shot_name}'&sort[0][field]=Created&sort[0][direction]=desc`, {
            headers: { Authorization: `Bearer ${AIR_KEY}` }
        });
        const cJson = await cRes.json();
        document.getElementById('p-history').innerHTML = cJson.records.map(c => `
            <div style="background:#1c1c1e; padding:12px; border-radius:10px; margin-bottom:10px; font-size:14px; border-left:4px solid #007aff">
                <div style="color:#666; font-size:10px; margin-bottom:4px;">${new Date(c.createdTime).toLocaleString()}</div>
                ${c.fields.text || ''}
            </div>
        `).join('');

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            const v = document.getElementById('v-player');
            if(v) v.pause();
            document.getElementById('player-page').style.display = 'none';
            document.getElementById('app-home').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    function vPlay() { 
        const v = document.getElementById('v-player'); 
        if(v) v.paused ? v.play() : v.pause(); 
    }
    function vStep(d) { 
        const v = document.getElementById('v-player'); 
        if(v) v.currentTime += d * (1/24); 
    }

    load();
</script>
</body>
</html>
