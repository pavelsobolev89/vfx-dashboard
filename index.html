<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const TOKEN = 'patBsCg6ofoalEdYD.55dabf06728a4aaf6e5767957fa9a8577bcfdabb4fd055239e10d5edcd987143';
    const BASE = 'appgiNHAoONgW8Ha6';
    const TABLE = 'Shots';

    async function loadData() {
        const grid = document.getElementById('main-grid');
        grid.innerText = "Connecting to Airtable...";
        try {
            const url = "https://api.airtable.com/v0/" + BASE + "/" + TABLE;
            const response = await fetch(url, {
                headers: { "Authorization": "Bearer " + TOKEN }
            });
            const data = await response.json();
            if (!data.records) {
                grid.innerText = "Airtable Error: " + (data.error ? data.error.message : "Unknown");
                return;
            }
            grid.innerHTML = "";
            data.records.forEach(function(r) {
                const f = r.fields;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = function() { openShot(r); };
                const thumb = (f.thumbnail && f.thumbnail[0]) ? f.thumbnail[0].url : "";
                card.innerHTML = '<img src="' + thumb + '" style="width:100%; border-radius:8px;">' +
                                 '<div style="padding:10px;"><b>' + (f.shot_name || "Unnamed") + '</b><br>' +
                                 '<span style="font-size:12px; color:#888;">' + (f.status || "") + '</span></div>';
                grid.appendChild(card);
            });
        } catch (e) {
            grid.innerText = "JS Error: " + e.message;
        }
    }

    function openShot(record) {
        const f = record.fields;
        document.getElementById('list-view').style.display = 'none';
        const detail = document.getElementById('detail-view');
        detail.style.display = 'block';
        document.getElementById('detail-title').innerText = f.shot_name || "Shot";
        const v = document.getElementById('detail-video');
        const img = document.getElementById('detail-img');
        
        let videoUrl = "";
        if (f.preview_file2) {
            videoUrl = Array.isArray(f.preview_file2) ? f.preview_file2[0].url : f.preview_file2;
        }

        if (videoUrl) {
            v.src = videoUrl;
            v.style.display = 'block';
            img.style.display = 'none';
            v.play().catch(function(){});
        } else {
            v.style.display = 'none';
            img.style.display = 'block';
            img.src = (f.thumbnail && f.thumbnail[0]) ? f.thumbnail[0].url : "";
        }

        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            v.pause();
            detail.style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            tg.BackButton.hide();
        });
    }

    loadData();
</script>
