<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VFX Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1c1c1d; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .tab { background: #2c2c2e; padding: 10px 15px; border-radius: 15px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .tab.active { background: #007aff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #2c2c2e; border-radius: 10px; overflow: hidden; font-size: 12px; border: 1px solid #333; }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
        .info { padding: 8px; }
        .btn { display: block; background: #007aff; color: white; text-align: center; padding: 6px; border-radius: 5px; text-decoration: none; margin-top: 8px; }
        #error-display { color: #ff3b30; font-family: monospace; font-size: 11px; margin-bottom: 20px; background: #2b0c0c; padding: 10px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <div id="error-display"></div>
    <div id="tabs-bar" class="tabs"></div>
    <div id="main-grid" class="grid">Загрузка...</div>

    <script>
        // 1. НАСТРОЙКИ (ВСТАВЬ СВОИ ДАННЫЕ В КАВЫЧКИ)
        const TOKEN = 'patBsCg6ofoalEdYD.553cfd245cc80e905db392a808d7b82a52f8cef276a6601493da22552e85867f';
        const BASE = 'appgiNHAoONgW8Ha6';
        const TABLE = 'Shots';

        const errDiv = document.getElementById('error-display');
        const grid = document.getElementById('main-grid');

        // Функция вывода ошибок
        function fail(msg) {
            errDiv.style.display = 'block';
            errDiv.innerHTML += '<div>> ' + msg + '</div>';
            grid.innerHTML = 'Ошибка загрузки';
        }

        // Проверка связи
        window.onerror = function(m, u, l) { fail('JS Error: ' + m + ' at line ' + l); };

        async function start() {
            try {
                if (!window.Telegram || !window.Telegram.WebApp) {
                    fail('Telegram WebApp SDK не найден');
                }
                window.Telegram.WebApp.expand();

                const response = await fetch(`https://api.airtable.com/v0/${BASE}/${encodeURIComponent(TABLE)}`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    fail('Airtable Error ' + response.status + ': ' + errorText);
                    return;
                }

                const data = await response.json();
                const records = data.records;

                if (!records || records.length === 0) {
                    grid.innerHTML = 'В таблице нет данных';
                    return;
                }

                buildApp(records);
            } catch (e) {
                fail('Критический сбой: ' + e.message);
            }
        }

        function buildApp(data) {
            const tabsBar = document.getElementById('tabs-bar');
            
            // Получаем эпизоды (первые 4 буквы, например ep01)
            const eps = [...new Set(data.map(r => String(r.fields.shot_name || "").substring(0, 4).toLowerCase()))].sort();

            tabsBar.innerHTML = '';
            eps.forEach((name, i) => {
                const t = document.createElement('div');
                t.className = 'tab' + (i === 0 ? ' active' : '');
                t.innerText = name.toUpperCase();
                t.onclick = () => {
                    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
                    t.classList.add('active');
                    showEps(data, name);
                };
                tabsBar.appendChild(t);
            });

            showEps(data, eps[0]);
        }

        function showEps(data, filter) {
            grid.innerHTML = '';
            const filtered = data.filter(r => String(r.fields.shot_name || "").toLowerCase().startsWith(filter));

            filtered.forEach(r => {
                const f = r.fields;
                const img = (f.thumbnail && f.thumbnail[0]) ? f.thumbnail[0].url : 'https://via.placeholder.com/200x112/333/666?text=No+Thumb';
                
                grid.innerHTML += `
                    <div class="card">
                        <img src="${img}" class="thumb">
                        <div class="info">
                            <b>${f.shot_name || 'Shot'}</b><br>
                            <span style="color:#0a84ff">${f.status || ''}</span>
                            <a href="${f.preview_url || '#'}" class="btn">PLAY</a>
                        </div>
                    </div>
                `;
            });
        }

        start();
    </script>
</body>
</html>
