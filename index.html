<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Pipeline Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1c; color: white; margin: 0; padding: 10px; }
        /* Стили вкладок */
        .tabs { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; padding-bottom: 10px; }
        .tab { background: #333; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #0088cc; }
        
        /* Стили карточек */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #2a2a2a; border-radius: 10px; overflow: hidden; border: 1px solid #444; }
        .thumb { width: 100%; height: 100px; object-fit: cover; background: #000; }
        .info { padding: 10px; font-size: 14px; }
        .status { font-size: 11px; color: #aaa; text-transform: uppercase; }
        .btn { display: block; background: #0088cc; color: white; text-align: center; 
               padding: 8px; margin-top: 10px; text-decoration: none; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="episode-tabs" class="tabs">
        </div>

    <div id="shots-grid" class="grid">
        </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        const AIRTABLE_API_KEY = 'patBFo3Js2TxYbyxa.a8e57c570761c306adcd18b67649c2c48b2b4017f4ac570d9f9212a16c6ecb28'; // Создай в Airtable (Personal Access Token)
        const BASE_ID = 'appgiNHAoONgW8Ha6';
        const TABLE_NAME = 'Table 1';

        let allShots = [];

        async function loadData() {
            const url = `https://api.airtable.com/v0/${BASE_ID}/${TABLE_NAME}`;
            const response = await fetch(url, {
                headers: { Authorization: `Bearer ${AIRTABLE_API_KEY}` }
            });
            const data = await response.json();
            allShots = data.records;
            
            createTabs();
            renderShots('ep01'); // По умолчанию показываем первый эпизод
        }

        function createTabs() {
            // Вытаскиваем уникальные эпизоды из имен шотов (первые 4 символа: ep01)
            const episodes = [...new Set(allShots.map(s => s.fields.shot_name.substring(0, 4)))];
            const container = document.getElementById('episode-tabs');
            
            episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'tab';
                div.innerText = ep.toUpperCase();
                div.onclick = () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    div.classList.add('active');
                    renderShots(ep);
                };
                container.appendChild(div);
            });
        }

        function renderShots(filter) {
            const grid = document.getElementById('shots-grid');
            grid.innerHTML = '';
            
            const filtered = allShots.filter(s => s.fields.shot_name.startsWith(filter));
            
            filtered.forEach(shot => {
                const f = shot.fields;
                // Предполагаем, что тамбнейл — это вложение в Airtable (первое фото)
                const thumbUrl = f.thumbnail ? f.thumbnail[0].url : '';
                
                grid.innerHTML += `
                    <div class="card">
                        <img src="${thumbUrl}" class="thumb">
                        <div class="info">
                            <div>${f.shot_name}</div>
                            <div class="status">${f.status}</div>
                            <a href="${f.preview_url}" class="btn">WATCH PREVIEW</a>
                        </div>
                    </div>
                `;
            });
        }

        loadData();
    </script>
</body>
</html>
